<style>
:root{--bg:#fbf7f0;--card:#fff;--fg:#1f1b16;--mut:#6b6259;--line:#e6ddd0;--acc:#c2410c;--acc2:#fde8d8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 40px}
header{padding:22px 0 10px}
header h1{margin:0;font-size:clamp(26px,6vw,40px);letter-spacing:-.02em;line-height:1.05}
header h1 span{color:var(--acc)}
header p{margin:6px 0 0;color:var(--mut)}
#map{height:62vh;min-height:360px;border-radius:14px;border:1px solid var(--line);margin:12px 0 8px;background:#e9e4da}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin:6px 0 14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:24px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;margin:0 -14px;padding-left:14px!important;padding-right:14px!important;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;color:var(--fg)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.dim{display:none}
.card .hd{display:flex;align-items:flex-start;gap:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fg);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.card .addr{font-weight:700;font-size:16px;line-height:1.2}
.card .sub{color:var(--mut);font-size:13px}
.acts{margin:2px 0 0;padding:0;list-style:none}
.acts li{display:grid;grid-template-columns:6.4em 1fr;gap:8px;padding:4px 0;border-top:1px dashed var(--line);font-size:14px}
.acts li.off{display:none}.acts li.on{background:var(--acc2);margin:0 -6px;padding:4px 6px;border-radius:6px;border-top-color:transparent}
.acts .t{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.acts .g{color:var(--mut);font-size:12.5px;display:block}
.links{display:flex;gap:8px;margin-top:4px}
.links a{font-size:13px;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff}
.links a:active{background:var(--acc2)}
footer{color:var(--mut);font-size:12.5px;margin-top:26px}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px #0005;display:grid;place-items:center}
.pin b{transform:rotate(45deg);color:#fff;font:700 12px system-ui}
.pin.dim{opacity:.35}
.leaflet-popup-content{font:13.5px/1.4 system-ui;margin:10px 12px}
.leaflet-popup-content a{color:var(--acc)}
@media(max-width:600px){#map{height:52vh}.chips{flex-wrap:wrap;overflow:visible;white-space:normal;position:static;margin:0;padding-left:0!important;padding-right:0!important}.grid{grid-template-columns:1fr}}
@media print{#map{height:480px}.chips{display:none}.card.dim{display:flex}.acts li.off{display:grid}}
</style></head><body><div class="wrap">

const GC={rock:"#dc2626",singer:"#2563eb",country:"#b45309",folk:"#16a34a",funk:"#7c3aed",pop:"#db2777",punk:"#111827",indie:"#0891b2",reggae:"#ca8a04",classical:"#6b7280"};
